# Local development stack: databases exposed on host ports, hot reload, no reverse proxy.
#   docker compose -f docker-compose.dev.yml up
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: ai_saas
      MYSQL_USER: ai_saas
      MYSQL_PASSWORD: devpassword
    ports:
      - '3306:3306'
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-pdevroot']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      DEBUG: 'true'
      ENVIRONMENT: development
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file: [.env]
    command: ['celery', '-A', 'app.workers.celery_app', 'worker', '--loglevel=debug', '--concurrency=2']
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  mysql_dev_data:
