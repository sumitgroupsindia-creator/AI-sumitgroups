# Alternative to the default Caddy setup, for teams that standardise on Nginx.
# TLS certificates are expected from certbot:
#   certbot certonly --nginx -d ai.sumitgroups.com

upstream ai_backend {
    server backend:8000;
    keepalive 32;
}

upstream ai_frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name ai.sumitgroups.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.sumitgroups.com;

    ssl_certificate     /etc/letsencrypt/live/ai.sumitgroups.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.sumitgroups.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    server_tokens off;

    # Must be >= MAX_UPLOAD_MB with headroom for multipart overhead.
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Critical for SSE chat streaming: without these the response is buffered
        # and the client receives the whole answer at once instead of token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Image generation can legitimately run for minutes.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
    }

    location = /health { proxy_pass http://ai_backend/health; }
    location = /ready  { proxy_pass http://ai_backend/ready; }

    location / {
        proxy_pass http://ai_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
