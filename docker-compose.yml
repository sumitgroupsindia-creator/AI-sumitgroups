services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  migrate:
    build:
      context: ./backend
    env_file: [.env]
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    volumes:
      # Persistent storage: generated/uploaded images must survive container replacement.
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    command: ['celery', '-A', 'app.workers.celery_app', 'worker', '--loglevel=info', '--concurrency=4']
    volumes:
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'celery', '-A', 'app.workers.celery_app', 'inspect', 'ping', '-d', 'celery@$$HOSTNAME']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: Caddy serves the app and proxies /api to the backend.
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-ai.sumitgroups.com}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [internal]

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
