name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must not deploy out of order.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_BACKEND: ghcr.io/sumitgroupsindia-creator/ai-sumitgroups-backend
  IMAGE_FRONTEND: ghcr.io/sumitgroupsindia-creator/ai-sumitgroups-frontend

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: ai_saas_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestroot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Backend tests
        working-directory: backend
        env:
          # The suite DROPs and recreates every table, so it must never point anywhere but the
          # throwaway schema this job just started.
          TEST_DATABASE_URL: mysql+aiomysql://test:test@127.0.0.1:3306/ai_saas_test?charset=utf8mb4
          JWT_SECRET: ci_secret_not_used_outside_this_job
          DATABASE_URL: mysql+aiomysql://test:test@127.0.0.1:3306/ai_saas_test?charset=utf8mb4
        run: python -m pytest -q

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm typecheck

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The deploy half stays dormant until the VPS secrets exist, so the workflow is useful (and
      # green) from the first push rather than failing on every commit until someone finishes setup.
      can_deploy: ${{ steps.deploy_configured.outputs.can_deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the VPS configured?
        id: deploy_configured
        run: echo "can_deploy=${{ secrets.VPS_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # backend, worker and migrate all run this one image.
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # NEXT_PUBLIC_API_URL is compiled into the bundle here, not at runtime.
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: NEXT_PUBLIC_API_URL=/api/v1
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs: build
    if: needs.build.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Only needed on hosts that moved SSH off 22 — Hostinger, for one, uses 65002.
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/ai-sumitgroups

            # .env and storage/ are untracked, so a hard reset leaves them alone.
            git fetch --prune origin
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Deploy the exact commit that was just built, not a mutable :latest.
            export IMAGE_TAG
            docker compose pull migrate backend worker frontend
            docker compose up -d

            docker logout ghcr.io
            docker image prune -f

      - name: Verify the site is serving
        run: |
          set -e
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://ai.sumitgroups.com/ready | tee /dev/stderr | grep -q '"status":"ready"'; then
              echo "Deploy verified."
              exit 0
            fi
            echo "not ready yet, retry $i/12"
            sleep 10
          done
          echo "Site did not become ready within 2 minutes."
          exit 1
